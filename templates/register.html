<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ManjXrudo Register</title>

<style>
body{
    margin:0;
    font-family:monospace;
    background:black;
    color:#00ffcc;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Box */
.container{
    background:rgba(0,0,0,0.9);
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 20px #00ffcc;
    width:320px;
}

/* Title */
.title{
    text-align:center;
    font-size:26px;
    margin-bottom:15px;
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 5px #00ffcc; }
    to{ text-shadow:0 0 20px #00ffcc; }
}

/* Inputs */
input{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:black;
    border:1px solid #00ffcc;
    color:#00ffcc;
    border-radius:8px;
}

/* Button */
button{
    width:100%;
    padding:10px;
    margin-top:15px;
    background:#00ffcc;
    border:none;
    color:black;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#00ccaa;
}

/* Telegram Button */
.telegram{
    background:#0088cc;
    color:white;
}

.msg{
    text-align:center;
    margin-top:10px;
    color:yellow;
}
</style>

</head>

<body>

<div class="container">

<div class="title">⚡ ManjXrudo ⚡</div>

<!-- Telegram Login -->
<a href="https://t.me/rudoaibot?start=login">
<button class="telegram">🚀 Login with Telegram</button>
</a>

<!-- Register -->
<form id="form">
<input type="text" name="username" placeholder="Username" required>
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>

<button type="submit">Register</button>
</form>

<div class="msg" id="msg"></div>

</div>

<script>
const form = document.getElementById("form");

form.addEventListener("submit", async function(e){
    e.preventDefault();

    const data = new FormData(form);

    const res = await fetch("/register", {
        method:"POST",
        body:data
    });

    const result = await res.json();

    document.getElementById("msg").innerText = result.msg;
});
</script>

</body>
</html>
