<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ManjXrudo</title>

<style>
body{
    background:black;
    color:#00ffcc;
    font-family:monospace;
    text-align:center;
}
input,button{
    padding:10px;
    margin:5px;
    background:black;
    color:#00ffcc;
    border:1px solid #00ffcc;
}
button{
    cursor:pointer;
}
</style>

<script>
async function sendOTP(){
    let email = document.getElementById("email").value;

    let res = await fetch("/send-otp", {
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`email=${email}`
    });

    let data = await res.json();
    alert(data.msg);
}

async function verifyOTP(){
    let email = document.getElementById("email").value;
    let otp = document.getElementById("otp").value;

    let res = await fetch("/verify-otp", {
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`email=${email}&otp=${otp}`
    });

    let data = await res.json();
    alert(data.msg);
}
</script>

</head>

<body>

<h2>⚡ ManjXrudo ⚡</h2>

<!-- EMAIL -->
<input type="email" id="email" placeholder="Enter Email"><br>

<button onclick="sendOTP()">Send OTP</button><br>

<input type="text" id="otp" placeholder="Enter OTP"><br>

<button onclick="verifyOTP()">Verify OTP</button>

<hr>

<h3>Register</h3>
<form action="/register" method="post">
<input type="text" name="username" placeholder="Username" required><br>
<input type="email" name="email" placeholder="Same Email" required><br>
<input type="password" name="password" placeholder="Password" required><br>
<button type="submit">Register</button>
</form>

<hr>

<h3>Login</h3>
<form action="/login" method="post">
<input type="email" name="email" placeholder="Email"><br>
<input type="password" name="password" placeholder="Password"><br>
<button type="submit">Login</button>
</form>

</body>
</html>
