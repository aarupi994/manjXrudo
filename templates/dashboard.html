<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:black;
    color:#00ffcc;
    font-family:monospace;
}

/* Sidebar */
.sidebar{
    width:200px;
    height:100vh;
    background:#000;
    border-right:2px solid #00ffcc;
    position:fixed;
}

.sidebar h2{
    text-align:center;
}

.sidebar a{
    display:block;
    padding:15px;
    color:#00ffcc;
    text-decoration:none;
    transition:0.3s;
}

.sidebar a:hover{
    background:#00ffcc;
    color:black;
}

/* Main */
.main{
    margin-left:200px;
    padding:20px;
}

/* Box */
.box{
    border:2px solid #00ffcc;
    padding:20px;
    margin-top:20px;
    box-shadow:0 0 15px #00ffcc;
    border-radius:10px;
}

/* Button */
.btn{
    padding:12px 25px;
    border:2px solid #00ffcc;
    background:black;
    color:#00ffcc;
    cursor:pointer;
    transition:0.3s;
    font-size:16px;
}

.btn:hover{
    background:#00ffcc;
    color:black;
    box-shadow:0 0 20px #00ffcc;
    transform:scale(1.1);
}

/* Responsive (Mobile) */
@media(max-width:768px){
    .sidebar{
        width:100%;
        height:auto;
        position:relative;
        display:flex;
        justify-content:space-around;
    }

    .main{
        margin-left:0;
    }
}

/* Snow Effect */
.snow{
    position:fixed;
    top:0;
    color:white;
    animation:fall linear;
}

@keyframes fall{
    to{
        transform:translateY(100vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>⚡ Panel</h2>
    <a href="/dashboard">Dashboard</a>
    <a href="/start-ad">Earn Coin</a>
    <a href="#">Profile</a>
</div>

<div class="main">

<h2>Welcome {{username}}</h2>

<div class="box">
    <h3>💰 Coins: {{coins}}</h3>
</div>

<div class="box">
    <a href="/start-ad">
        <button class="btn">Watch Ads → Earn</button>
    </a>
</div>

</div>

<!-- Snow Animation -->
<script>
setInterval(()=>{
    let snow=document.createElement("div");
    snow.className="snow";
    snow.innerHTML="❄️";
    snow.style.left=Math.random()*window.innerWidth+"px";
    snow.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(snow);

    setTimeout(()=>snow.remove(),5000);
},200);
</script>

</body>
</html>
