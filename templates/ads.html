<!DOCTYPE html>
<html>
<head>
<title>Watching Ad</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="center-box">

    <h2>Ad Loading...</h2>

    <div class="circle">
        <span id="time">8</span>
    </div>

</div>

<script>
let t = 8;

let timer = setInterval(()=>{
    t--;
    document.getElementById("time").innerText = t;

    if(t<=0){
        clearInterval(timer);
        window.location.href="/complete-ad";
    }
},1000);
</script>

</body>
</html>
